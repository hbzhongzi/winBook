function testDoc(name, mime, inner) {
  const b = URL.createObjectURL(new Blob([inner], {type: mime}));
  const f = document.createElement("iframe");
  f.style.cssText = "width:320px;height:220px;border:1px solid #333;display:block;margin:4px";
  f.src = b;
  f.onload = () => {
    let d; try { d = f.contentDocument; } catch(e) { report(name, "cross-origin"); return; }
    const res = {
      contentType: d.contentType,
      styleSheets: d.styleSheets.length,
      resourceEntries: d.defaultView.performance.getEntriesByType("resource").length,
      svgPresent: !!d.querySelector("svg"),
      pColor: d.querySelector("p") ? getComputedStyle(d.querySelector("p")).color : "n/a",
    };
    report(name, JSON.stringify(res));
  };
  document.body.appendChild(f);
}
function report(name, r) {
  const div = document.createElement("div");
  div.textContent = name + " => " + r;
  div.style.cssText = "font-family:monospace;font-size:12px;border-bottom:1px solid #ccc;padding:2px";
  document.getElementById("out").appendChild(div);
}
